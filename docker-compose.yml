services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: grimoire
      POSTGRES_DB: grimoire
    volumes:
      - grimoire_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://grimoire:grimoire@db:5432/grimoire
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  grimoire_pg:
